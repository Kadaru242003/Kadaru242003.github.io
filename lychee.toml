# Link checker settings for .github/workflows/site.yml

# Resolve root-relative links such as /resume.pdf against the site folder.
root_dir = "."

max_retries = 3
timeout = 60
accept = ["200..=299", "429"]

exclude = [
  # LinkedIn blocks automated requests (HTTP 999), so it cannot be checked from CI.
  '^https://www\.linkedin\.com/',
  # Social preview image is checked locally as og-image.png; the live URL exists only after deploy.
  '^https://kadaru242003\.github\.io/',
]

exclude_path = ["node_modules"]
