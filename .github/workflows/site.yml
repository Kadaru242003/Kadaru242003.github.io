name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly link check, Mondays 14:17 UTC, to catch links that break over time.
    - cron: "17 14 * * 1"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: HTML validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: html-validate (spec and accessibility rules)
        run: npx --yes html-validate@9.7.1 *.html projects/*.html
      - name: W3C Nu HTML Checker
        run: |
          npm install --no-save vnu-jar@24.10.17
          java -jar node_modules/vnu-jar/build/dist/vnu.jar --errors-only *.html projects/*.html
      - name: No em dashes
        run: |
          if LC_ALL=C.UTF-8 grep -rnIP --exclude-dir=.git --exclude-dir=node_modules '\x{2014}' .; then
            echo "Em dash found. Use a comma, colon, or 'to' instead."
            exit 1
          fi
      - name: Local assets exist
        run: test -f og-image.png && test -f favicon.svg && test -f resume.pdf
      - name: Fetch GitHub contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_contributions.py Kadaru242003 contributions.json
      - name: Build site
        run: python3 scripts/build.py contributions.json
      - name: Validate built site
        run: |
          npx --yes html-validate@9.7.1 _site/*.html _site/projects/*.html
          java -jar node_modules/vnu-jar/build/dist/vnu.jar --errors-only _site/*.html _site/projects/*.html
          grep -q 'id="github"' _site/index.html && echo "GitHub activity section present" || echo "::warning::GitHub activity section not built"
      - name: Contributions data (for review)
        if: always()
        run: test -f contributions.json && cat contributions.json || echo "no contributions data"

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress *.html projects/*.html
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [html, links]
    # Push, manual run, or the weekly schedule (keeps the GitHub activity graph current).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GitHub contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_contributions.py Kadaru242003 contributions.json
      - name: Build site
        run: python3 scripts/build.py contributions.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
